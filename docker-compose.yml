services:
  standalone:
    build:
      context: .
      target: standalone
    container_name: dlsm-standalone
    ports:
      - "8080:8080"
      - "8082:8082"
    environment:
      - TEST_MODE=true
      - MEMTABLE_MAX_BYTES=1048576
      - NODE_ID=standalone
    volumes:
      - dlsm_data:/var/lib/dlsm
    restart: "no"
    profiles:
      - standalone

  # ./dbctl inspect manifest | wal | sstable <id>: the server's offline inspector over the
  # stopped node's volume, mounted read-only so inspection can change nothing.
  inspect:
    build:
      context: .
      target: standalone
    entrypoint: ["java", "-jar", "/app/server.jar", "inspect"]
    volumes:
      - dlsm_data:/var/lib/dlsm:ro
    restart: "no"
    profiles:
      - tools

  # ./dbctl test checkpoint-1 ...: arguments go to the runner, the report to ./reports.
  student-tests:
    build:
      context: .
      target: student-tests
    volumes:
      - ./reports:/app/reports
    restart: "no"
    profiles:
      - tests

volumes:
  dlsm_data:
