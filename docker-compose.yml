services:
  standalone:
    build:
      context: .
      target: standalone
    container_name: dlsm-standalone
    ports:
      - "8080:8080"
      - "8082:8082"
    environment:
      - TEST_MODE=true
      - MEMTABLE_MAX_BYTES=1048576
      - NODE_ID=standalone
    volumes:
      - dlsm_data:/var/lib/dlsm
    restart: "no"
    profiles:
      - standalone

  # ./dbctl test checkpoint-1 ...: arguments go to the runner, the report to ./reports.
  student-tests:
    build:
      context: .
      target: student-tests
    volumes:
      - ./reports:/app/reports
    restart: "no"
    profiles:
      - tests

volumes:
  dlsm_data:
