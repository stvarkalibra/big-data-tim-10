
name: Linux Maven Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kimi/sstable-persistence

jobs:
  test:
    name: SSTable and Full Maven Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run SSTable persistence tests
        run: |
          ./mvnw -pl dlsm-core \
            "-Dtest=SSTablePersistenceTest,SSTablePointReadOracleTest,SSTableBloomOracleTest" \
            test

      - name: Run all Maven tests
        run: ./mvnw clean verify
